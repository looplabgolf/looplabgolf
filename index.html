<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>looplab golf</title>

  <!-- Instant redirect to the App Store -->
  <meta http-equiv="refresh" content="0; url=https://apps.apple.com/de/app/looplab-golf/id6766962007">

  <!-- Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000000;
      --text: #F5F1E8;
      --text-secondary: #8A8A82;
      --accent: #5BF08C;
      --border: rgba(255,255,255,0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .wordmark {
      font-family: "Space Grotesk", sans-serif;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
    }
    .wordmark span { font-weight: 500; color: var(--text-secondary); }
    .tagline {
      font-family: "Space Grotesk", sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 40px;
      letter-spacing: -0.01em;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 32px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .redirect-note {
      font-family: "Space Grotesk", sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 28px;
    }
    .button {
      display: inline-block;
      background: var(--accent);
      color: #06120D;
      font-family: "Space Grotesk", sans-serif;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
      padding: 16px 32px;
      border-radius: 16px;
      transition: transform 0.15s ease;
    }
    .button:active { transform: scale(0.97); }
    .footer {
      position: fixed;
      bottom: 24px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="wordmark">looplab <span>golf</span></div>
  <div class="tagline">Handicap · stats · scorecards</div>

  <div class="spinner"></div>
  <div class="redirect-note">Opening the App Store…</div>

  <a class="button" href="https://apps.apple.com/de/app/looplab-golf/id6766962007">
    Open in App Store
  </a>

  <div class="footer">looplabgolf.com</div>

  <script>
    setTimeout(function () {
      window.location.href = "https://apps.apple.com/de/app/looplab-golf/id6766962007";
    }, 300);
  </script>

</body>
</html>
